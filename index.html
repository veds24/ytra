<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YatraOne — Unified Multi-Modal Transit</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="phone">

    <!-- ============ HOME SCREEN ============ -->
    <div id="screen-home" class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons">📶 🔋</span>
      </div>

      <div class="brand">
        <h1>🚇 YatraOne</h1>
        <p class="tagline">One app. Every mode. Smarter commute.</p>
      </div>

      <div class="form-group">
        <label for="input-origin">📍 From</label>
        <select id="input-origin">
          <option>Andheri West</option>
          <option>Bandra</option>
          <option>Dadar</option>
          <option>Borivali</option>
          <option>Thane</option>
          <option>Chembur</option>
        </select>
      </div>

      <div class="form-group">
        <label for="input-destination">🎯 To</label>
        <select id="input-destination">
          <option>Lower Parel</option>
          <option>Churchgate</option>
          <option>Andheri West</option>
          <option>Thane</option>
          <option>Borivali</option>
          <option>Chembur</option>
        </select>
      </div>

      <div class="form-group">
        <label>⚡ Preference</label>
        <div class="prefs">
          <button id="pref-fastest" onclick="setPreference('Fastest')">Fastest</button>
          <button id="pref-cheapest" onclick="setPreference('Cheapest')">Cheapest</button>
          <button id="pref-balanced" class="active" onclick="setPreference('Balanced')">Balanced</button>
        </div>
      </div>

      <button id="btn-find" class="cta" onclick="findRoutes()">
        Find Best Route →
      </button>

      <div class="trust-row">
        <span>🔗 Unified from</span>
        <div class="app-chips">
          <span class="chip">Chalo</span>
          <span class="chip">M-Indicator</span>
          <span class="chip">Uber</span>
          <span class="chip">Rapido</span>
        </div>
      </div>
    </div>

    <!-- ============ LOADING SCREEN ============ -->
    <div id="screen-loading" class="screen hidden">
      <div class="loading-box">
        <div class="spinner"></div>
        <p class="loading-title">Fetching live transit data…</p>
        <p class="loading-sub">Connecting to Chalo • M-Indicator • Uber • Rapido</p>
        <div class="loading-bar"><div class="loading-fill"></div></div>
      </div>
    </div>

    <!-- ============ RESULTS SCREEN ============ -->
    <div id="screen-results" class="screen hidden">
      <div class="results-header">
        <div>
          <p class="results-label">Top routes</p>
          <h2 id="route-title">Andheri West → Lower Parel</h2>
        </div>
        <button id="btn-delay" class="warn" onclick="simulateDelay()">
          ⚠️ Delay
        </button>
      </div>

      <div id="cards-container"></div>

      <div class="results-footer">
        <button id="btn-new" class="cta secondary" onclick="resetSearch()">
          ← New Search
        </button>
      </div>
    </div>

    <!-- ============ DELAY MODAL ============ -->
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-icon">⚠️</div>
        <h3>Delay Detected</h3>
        <p id="modal-message"></p>
        <button id="btn-modal-close" class="cta" onclick="closeModal()">
          View New Route
        </button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
